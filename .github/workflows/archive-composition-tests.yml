name: Archive composition platform tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-composition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-composition:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cover the supported Python floor and the Windows CI version.
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          # Match the native Apple Silicon release runner and interpreters
          # documented for macOS source installs and packaged releases.
          - os: macos-26
            python: "3.13"
          - os: macos-26
            python: "3.14"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CDUMM and test dependencies
        run: python -m pip install -e ".[dev]"
      # This command is passed to each runner's default shell. It needs no
      # Bash utilities, POSIX environment assignments, or game installation.
      - name: Test archive composition and transaction paths
        run: >-
          python -m pytest -q -ra
          tests/test_standalone_archive_composition.py
          tests/test_transactional_io.py
          tests/test_transactional_io_absolute_path_guard.py
          tests/test_pathc_roundtrip_preserves_header.py
          tests/test_standalone_truly_new_dir.py
          tests/test_papgt_cd20_placeholder_entries.py
          tests/test_overlay_merge_no_drop_when_equal_vanilla.py
          tests/test_overlay_forces_dds_partial_payload.py
          tests/test_stage_file_skip_if_identical.py
          tests/test_apply_defers_destructive_deletes.py
